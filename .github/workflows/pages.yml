# Publica los cinco sitios de proveedores en GitHub Pages.
#
# La dirección resultante es estable y conocida de antemano, de modo que puede
# verificarse semanas antes del evento que el navegador integrado del entorno
# gestionado la alcanza:
#
#     https://axcel17.github.io/LLM-BK-WS-2026/
#
# Los sitios son estáticos y toda su navegación es relativa, así que funcionan
# servidos desde un subdirectorio. El estado viaja en la URL.
name: pages

on:
  push:
    branches: [main]
    paths: ["parte-1-cowork/entorno/sitios-proveedores/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, sin cancelar el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: parte-1-cowork/entorno/sitios-proveedores
      - id: despliegue
        uses: actions/deploy-pages@v4
