# Bloqueo por regresión.
#
# El typecheck y el formato se ejecutan sobre el estado tal como se entrega,
# porque el material con huecos también debe compilar: nadie empieza el taller
# con errores que no puso.
#
# La suite completa se ejecuta siempre sobre el proyecto resuelto. En `main`
# eso exige aplicar las soluciones primero; en `soluciones` ya están puestas y
# el paso no cambia nada. Así ninguna rama depende de la otra para validarse.
name: ci

on:
  push:
    branches: [main, soluciones]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx prettier --check .
      - name: Aplicar soluciones
        run: npm run solutions
      - name: Suite completa
        run: npm run test:only
